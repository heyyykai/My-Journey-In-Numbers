<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Journey in Numbers</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f1117;
  --card: #161b22;
  --text: #e6edf3;
  --accent: #58a6ff;
  --muted: #9da7b3;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
}

/* TITLE */

h1 {
  text-align: center;
  margin: 0 0 30px;
  font-size: 28px;
  line-height: 1.3;
}

/* CARDS */

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.card {
  min-width: 0;
  width: 100%;
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.card .label {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 4px;
  line-height: 1.4;
  overflow-wrap: break-word;
}

.card .value {
  font-size: 28px;
  font-weight: 600;
  color: var(--accent);
  line-height: 1.2;
}

/* =========================================
   TABLET / SMALLER NOTION EMBED
   ========================================= */

@media (max-width: 600px) {

  body {
    padding: 16px;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 22px;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .card {
    padding: 14px 10px;
    border-radius: 14px;
  }

  .card .label {
    font-size: 13px;
  }

  .card .value {
    font-size: 25px;
  }
}

/* =========================================
   PHONE / VERY NARROW NOTION EMBED
   ========================================= */

@media (max-width: 420px) {

  body {
    padding: 12px;
  }

  h1 {
    font-size: 21px;
    margin-bottom: 18px;
  }

  .grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .card {
    padding: 12px 7px;
    border-radius: 12px;
  }

  .card .label {
    font-size: 12px;
    line-height: 1.35;
  }

  .card .value {
    font-size: 23px;
  }
}

/* =========================================
   VERY SMALL PHONES
   ========================================= */

@media (max-width: 300px) {

  .grid {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 19px;
  }

  .card {
    padding: 12px;
  }
}
</style>

</head>

<body>

<div class="container">

  <h1>🌍 My Journey in Numbers</h1>

  <div class="grid">

```
<!-- Blogging -->
<div class="card">
  <div class="label">✍️ Started blogging in</div>
  <div class="value" data-start="1991" data-end="2016">0</div>
</div>

<!-- YouTube -->
<div class="card">
  <div class="label">🎥 Started YouTube in</div>
  <div class="value" data-start="1991" data-end="2021">0</div>
</div>

<!-- Traveling -->
<div class="card">
  <div class="label">✈️ First international trip in</div>
  <div class="value" data-start="1991" data-end="2014">0</div>
</div>

<!-- Countries -->
<div class="card">
  <div class="label">🌏 Countries visited</div>
  <div class="value" data-start="1" data-end="14">0</div>
</div>

<!-- Continents -->
<div class="card">
  <div class="label">🧭 Continents conquered</div>
  <div class="value" data-start="1" data-end="1">0</div>
</div>
```

  </div>

</div>

<script>

function animateValue(el, start, end, duration) {

  let range = end - start;
  let current = start;
  let increment = range / (duration / 20);

  let timer = setInterval(() => {

    current += increment;

    if (
      (increment > 0 && current >= end) ||
      (increment < 0 && current <= end)
    ) {

      current = end;
      clearInterval(timer);

    }

    el.textContent = Math.floor(current);

  }, 20);

}

document.querySelectorAll('.value').forEach(el => {

  const start = parseInt(el.dataset.start);
  const end = parseInt(el.dataset.end);

  animateValue(el, start, end, 1200);

});

</script>

</body>
</html>
